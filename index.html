<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Server Pulse — YGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div id="alertBanner" class="alert" hidden role="status"></div>
  <header class="top">
    <div class="brand" dir="ltr">YGUARD <span>/</span> PULSE</div>
    <div class="live"><i></i> LIVE</div>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow" id="mode">Public</p>
      <h1 id="serverName">YGuard · Mirage #3</h1>
      <p class="sub" id="mapLine">de_mirage · round <span id="round">12</span></p>
      <div class="score" dir="ltr">
        <div>
          <span class="label">CT</span>
          <strong id="scoreCt">7</strong>
        </div>
        <div class="sep">:</div>
        <div>
          <span class="label">T</span>
          <strong id="scoreT">5</strong>
        </div>
      </div>
      <p class="cap" id="playersLine">8 / 10 players</p>
      <div class="spark-wrap">
        <span class="spark-label">Players · last 30</span>
        <div class="sparkline" id="sparkline" role="img"></div>
      </div>
    </section>

    <section class="roster-wrap">
      <div class="roster-head">
        <h2>Roster</h2>
        <div class="sort" id="sortToggle" role="group" aria-label="Sort roster">
          <button type="button" data-sort="kills" class="active">K</button>
          <button type="button" data-sort="kd">K/D</button>
          <button type="button" data-sort="ping">Ping</button>
        </div>
      </div>
      <p class="hint" id="sortHint">Sorted by KILLS · ping color-coded</p>
      <div class="cols" aria-hidden="true">
        <span></span><span></span><span>K</span><span>D</span><span>K/D</span><span>ms</span>
      </div>
      <div class="roster" id="roster"></div>
    </section>
  </main>

  <footer>
    <span>Server Pulse</span>
    <span dir="ltr">github.com/kianPk</span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
